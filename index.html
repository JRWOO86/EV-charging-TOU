*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* top bar */

.btn{border:1px solid var(--border-strong);background:var(--control);border-radius:var(--control-radius);padding:7px 14px;font-size:13px;font-weight:500;text-decoration:none;color:var(--text);white-space:nowrap}

/* layout */
.page{max-width:1240px;margin:auto;padding:26px 20px 40px}

.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* paper header */
.paper{background:var(--accent-soft);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--card-radius);padding:22px 26px;display:grid;gap:8px;position:relative}

.paper .authors i{color:var(--text)}
.paper .note{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--secondary);margin-top:4px}
.lang{position:absolute;right:22px;top:18px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--secondary)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--control-radius);padding:3px;gap:2px}
.seg button{white-space:nowrap;border:0;background:none;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--secondary);font-weight:500}

.basis{margin-top:12px;font-size:13px;color:var(--secondary)}
.basis b{color:var(--text);font-weight:600;margin-right:6px}

.kpi{display:grid;gap:6px}
.kpi .label{font-size:13px;color:var(--secondary);display:flex;align-items:center;gap:6px}
.kpi .value{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.15;font-variant-numeric:tabular-nums}

.kpi .sub.neg{color:var(--negative)}
.kpi .sub.pos{color:var(--positive)}

.chart-wrap{width:100%;position:relative}

.legend span{display:inline-flex;align-items:center;gap:6px}

.legend i.dash{background:repeating-linear-gradient(90deg,var(--chart-gray) 0 4px,transparent 4px 7px)}
.legend b{color:var(--text);font-weight:600;margin-left:2px}

.ranked .bar span{position:relative;z-index:1;display:inline-flex;align-items:center;height:100%;padding:0 10px;font-size:13px;font-weight:500;color:var(--text)}
.ranked .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;min-width:52px;text-align:right}

.table-wrap{overflow-x:auto;margin:6px -6px 0;padding:0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}

.select{width:100%;border:1px solid var(--border-strong);background:var(--control);border-radius:var(--control-radius);padding:8px 10px;font-size:13px}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 22px rgb(13 37 58/12%);display:none;min-width:120px}

.hit{fill:transparent}
.hit:hover{fill:var(--text);fill-opacity:.04}

/* dialog */
dialog{border:1px solid var(--border);border-radius:14px;padding:0;max-width:600px;max-height:88vh;overflow:auto;width:calc(100% - 32px);background:var(--surface);color:var(--text)}

.dlg{padding:22px 24px}
.dlg h3{font-size:16px;font-weight:600;margin-bottom:10px}
.dlg ol{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:6px;color:var(--secondary)}
.dlg ol b{color:var(--text);font-weight:600}
.dlg .close{margin-top:16px;display:flex;justify-content:flex-end}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

<script>
const DATA=JSON.parse(document.getElementById('research-data').textContent);
const S={lang:'ko',tab:'overview',season:'Spring',gseason:'Spring',scen:'sce2',gscen:'sce3li',cmp:'3',x:{mode:'sce3',day:0,night:600,shoulder:300,li:false,season:'Spring'}};
const $=id=>document.getElementById(id);
const narrow=()=>window.innerWidth<700,CW=()=>narrow()?460:760;
const tr=(ko,en)=>S.lang==='ko'?ko:en;
const fmt=(n,d=0)=>Number(n).toLocaleString(S.lang==='ko'?'ko-KR':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/^-/,'−');
const pct=(n,d=1)=>fmt(n,d)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const krw=v=>S.lang==='ko'?fmt(v)+'원':'KRW '+fmt(v);
const bn=(v,d=0)=>S.lang==='ko'?fmt(v*10,d)+'억 원':fmt(v,d===0?1:d)+' bn KRW';
const signed=(v,d=1)=>(v>=0?'+':'−')+fmt(Math.abs(v),d);
const SEASONS=['Spring','Summer','Fall','Winter'];
const seasonName=s=>({Spring:tr('봄 (3–5월)','Spring (Mar–May)'),Summer:tr('여름 (6–8월)','Summer (Jun–Aug)'),Fall:tr('가을 (9–11월)','Fall (Sep–Nov)'),Winter:tr('겨울 (12–2월)','Winter (Dec–Feb)')})[s];
const seasonShort=s=>({Spring:tr('봄','Spring'),Summer:tr('여름','Summer'),Fall:tr('가을','Fall'),Winter:tr('겨울','Winter')})[s];
const SC={bau:'var(--chart-gray)',sce1:'var(--chart-3)',sce2:'var(--chart-1)',sce3:'var(--chart-2)',sce1li:'var(--chart-3)',sce2li:'var(--chart-1)',sce3li:'var(--chart-2)',custom:'var(--explore)'};
const scenShort=k=>({bau:'BaU',sce1:'SCE 1',sce2:'SCE 2',sce3:'SCE 3',sce1li:'SCE 1-LI',sce2li:'SCE 2-LI',sce3li:'SCE 3-LI',custom:tr('직접 설정','Custom')})[k];
const tabDefs=[['overview','연구 개요','Overview'],['prefs','운전자의 충전 선호','Charging preferences'],['scen','최적 요금제와 충전 이동','Optimized tariffs & charging shift'],['grid','연간 전력망 효과','Annual grid effects'],['explore','요금제 직접 설계','Design your own tariff']];
const hourLabel=i=>String(i).padStart(2,'0')+':00';
function hourRanges(idx){if(!idx.length)return '';const a=idx.slice().sort((p,q)=>p-q),out=[];let st=a[0],pr=a[0];for(let i=1;i<=a.length;i++){if(i<a.length&&a[i]===pr+1){pr=a[i];continue}out.push([st,pr+1]);if(i<a.length){st=a[i];pr=a[i]}}
  if(out.length>1&&out[0][0]===0&&out[out.length-1][1]===24){const l=out.pop();out[0][0]=l[0]}return out.map(([x,y])=>`${String(x).padStart(2,'0')}–${String(y).padStart(2,'0')}`).join(', ')+tr('시','')}
function minMaxHours(t){const mn=Math.min(...t),mx=Math.max(...t);return {lo:hourRanges(t.map((v,i)=>v<=mn+20?i:-1).filter(i=>i>=0)),hi:hourRanges(t.map((v,i)=>v>=mx-20?i:-1).filter(i=>i>=0)),mn,mx}}

/* ---------- shared chrome ---------- */
function paperCard(){return `
  <div class="eyebrow">${tr('출판 논문 기반 연구 대시보드','Published research dashboard')}</div>
  <h1>Assessing optimized time-of-use pricing for electric vehicle charging in deep vehicle-grid integration system</h1>
  <div class="authors">So Young Yang, JongRoul Woo, Wonjong Lee <b>(2024)</b> &nbsp;&nbsp; <i>Energy Economics</i>, 138, 107852</div>
  <div class="note"><span>${tr('본 대시보드는 저희가 출판한 위 논문과 연구 데이터를 바탕으로 제작되었습니다.','This dashboard is built on the paper above, published by our lab, and its underlying research data.')}</span><a href="https://doi.org/10.1016/j.eneco.2024.107852" target="_blank" rel="noopener noreferrer">${tr('논문 원문 보기 ↗','Read the paper ↗')}</a></div>
  <div class="lang"><span>${tr('언어 / Language','Language')}</span><span class="seg"><button data-lang="ko" aria-pressed="${S.lang==='ko'}">한국어</button><button data-lang="en" aria-pressed="${S.lang==='en'}">English</button></span></div>`}
function sectionHead(title,sub,controls=''){return `<div class="section-head"><div><h2>${title}</h2><div class="sub">${sub}</div></div><div class="controls-row">${controls}</div></div>`}
function kpi(label,value,unit,sub,cls=''){return `<article class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}<small>${unit}</small></div><div class="sub ${sub.cls||''}">${sub.text||sub}</div></article>`}
function chipPub(){return `<span class="chip"><span class="dot"></span>${tr('논문 발표값','Published values')}</span>`}
function chipCalc(){return `<span class="chip explore"><span class="dot"></span>${tr('대시보드 계산','Calculated here')}</span>`}
function chipData(){return `<span class="chip data"><span class="dot"></span>${tr('연구 자료','Study data')}</span>`}
function callout(html){return `<div class="callout">${html}</div>`}
function assumptions(items){return `<details class="assump"><summary>${tr('연구 가정과 자료 설명','Study assumptions and data notes')}</summary><div class="body">${items.map(i=>`<p>${i}</p>`).join('')}</div></details>`}
function seg(items,attr,cur){return `<span class="seg" role="group">${items.map(([v,l])=>`<button data-${attr}="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</span>`}
function slider(id,label,min,max,step,val,out,l,r){return `<div class="slider"><label for="sl-${id}">${label}<output id="out-${id}">${out}</output></label><input type="range" id="sl-${id}" data-param="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><div class="ends"><span>${l}</span><span>${r}</span></div></div>`}
function legend(items){return `<div class="legend">${items.map(([l,c,sq])=>`<span><i class="${sq==='dash'?'dash':sq?'sq':''}" style="${sq==='dash'?'':'background:'+c}"></i>${l}</span>`).join('')}</div>`}
function niceStep(max,n=4){const raw=max/n,p=10**Math.floor(Math.log10(raw));return [1,2,2.5,5,10].map(m=>m*p).find(v=>v>=raw)}
function tipRows(title,rows){return esc(JSON.stringify({t:title,rows}))}
function axisY(x0,x1,y,ticks,fmtFn){return ticks.map(t=>`<line class="grid-line" x1="${x0}" x2="${x1}" y1="${y(t)}" y2="${y(t)}"/><text x="${x0-8}" y="${y(t)+4}" text-anchor="end">${fmtFn(t)}</text>`).join('')}

/* ---------- charts ---------- */
/* 24-hour chart, index 0..23 = hour starting at i:00. series [{name,color,values,emph,dim,dash,step,area,dec}] */
function hourChart(series,{unit='MWh',W=CW(),H=narrow()?280:320,yLabel='',band=null,zero=true,yMin=null,yMax=null}={}){const L=W<500?44:62,R=W<500?22:28,T=28,B=40,all=series.flatMap(s=>s.values);
  let max=yMax??Math.max(...all,0),min=yMin??Math.min(...all,0);if(max===min)max=min+1;const step=niceStep(max-min,5),lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
  const x=i=>L+i*(W-L-R)/24,xc=i=>x(i+0.5),y=v=>H-B-(v-lo)/(hi-lo)*(H-T-B),ticks=[];for(let t=lo;t<=hi+1e-6;t+=step)ticks.push(t);
  const bandRect=band?`<rect x="${x(band[0])}" y="${T}" width="${x(band[1])-x(band[0])}" height="${H-T-B}" fill="var(--chart-2)" opacity=".08"/><text x="${(x(band[0])+x(band[1]))/2}" y="${T-8}" text-anchor="middle" style="font-size:11px;fill:var(--chart-2);font-weight:600">${band[2]}</text>`:'';
  const path=s=>s.step?s.values.map((v,i)=>`${i===0?'M':'L'}${x(i)},${y(v)} L${x(i+1)},${y(v)}`).join(' '):'M'+s.values.map((v,i)=>`${xc(i)},${y(v)}`).join(' L');
  const areas=series.filter(s=>s.area).map(s=>`<path d="${path(s)} L${s.step?x(24):xc(23)},${y(0)} L${s.step?x(0):xc(0)},${y(0)} Z" fill="${s.color}" opacity=".12"/>`).join('');
  const lines=series.map(s=>`<path d="${path(s)}" fill="none" stroke="${s.color}" stroke-width="${s.emph?3:2}" opacity="${s.dim?.45:1}" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`).join('');
  const hits=Array.from({length:24},(_,i)=>`<rect class="hit" x="${x(i)}" y="${T}" width="${(W-L-R)/24}" height="${H-T-B}" data-tip="${tipRows(hourLabel(i)+'–'+hourLabel((i+1)%24),series.map(s=>[s.name,fmt(s.values[i],s.dec??0)+' '+unit,s.color]))}"/>`).join('');
  const zl=zero&&lo<0&&hi>0?`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--border-strong)" stroke-width="1.2"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${bandRect}${axisY(L,W-R,y,ticks,v=>fmt(v))}${zl}<text x="${L}" y="${T-8}" style="font-size:10.5px">${yLabel||unit}</text>${areas}${lines}${(W<500?[0,6,12,18]:[0,4,8,12,16,20]).map(h=>`<text x="${x(h)}" y="${H-B+20}" text-anchor="middle">${hourLabel(h)}</text>`).join('')}<text x="${x(24)}" y="${H-B+20}" text-anchor="middle">24:00</text>${hits}</svg>`}
/* horizontal bars with sign: rows [{label,value,color,sub}] */
function hbarChart(rows,{unit='',W=CW(),dec=1,L=null,fmtV=null}={}){const rh=34,H=rows.length*rh+30,left=L??(narrow()?150:230),R=90,inner=W-left-R,vmax=Math.max(...rows.map(r=>Math.abs(r.value)),1),neg=rows.some(r=>r.value<0),x0=neg?left+inner*vmax/(2*vmax):left,sc=neg?inner/(2*vmax):inner/vmax,f=fmtV||(v=>fmt(v,dec));
  const bars=rows.map((r,i)=>{const yy=14+i*rh,w=Math.abs(r.value)*sc,xx=r.value>=0?x0:x0-w;return `<text x="${left-10}" y="${yy+rh/2+4}" text-anchor="end" style="fill:var(--text);font-size:12.5px">${r.label}</text><rect x="${xx}" y="${yy+6}" width="${w}" height="${rh-14}" rx="5" fill="${r.color}" opacity="${r.muted?.4:.9}"/><text x="${r.value>=0?x0+w+8:x0-w-8}" y="${yy+rh/2+4}" text-anchor="${r.value>=0?'start':'end'}" style="font-weight:600;fill:var(--text)">${(r.value>=0?'+':'−')+f(Math.abs(r.value))}${unit}</text><rect class="hit" x="${left}" y="${yy}" width="${inner}" height="${rh}" data-tip="${tipRows(r.label,[[r.sub||'',(r.value>=0?'+':'−')+f(Math.abs(r.value))+unit,r.color]])}"/>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${x0}" x2="${x0}" y1="8" y2="${H-14}" stroke="var(--border-strong)"/>${bars}</svg>`}
/* vertical grouped bars */
function barChart({groups,yMax,yMin=0,unit='%',W=CW(),H=300,L=52,R=20,T=22,B=52,labelAll=false,yFmt=null}){
  const totalBars=groups.reduce((s,g)=>s+g.bars.length,0),gap=14,inner=W-L-R,slot=(inner-gap*(groups.length-1))/totalBars,bw=Math.min(26,slot*.74);
  const y=v=>H-B-(v-yMin)/(yMax-yMin)*(H-T-B),f=yFmt||(v=>fmt(v,1)),tf=v=>fmt(v)+unit,ticks=Array.from({length:5},(_,i)=>yMin+i*(yMax-yMin)/4);
  let x=L,out='',labels='';
  groups.forEach(g=>{const gx0=x;g.bars.forEach(b=>{const cx=x+slot/2,neg=b.value<0,h=Math.abs(y(0)-y(b.value)),top=Math.min(y(0),y(b.value));out+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${b.color}" opacity="${b.muted?.35:1}"/>`;
      if(labelAll||b.label)out+=`<text x="${cx}" y="${neg?y(b.value)+14:y(b.value)-6}" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--text)">${f(b.value)}${unit}</text>`;
      out+=`<rect class="hit" x="${x}" y="${T}" width="${slot}" height="${H-T-B}" data-tip="${tipRows(g.label,[[b.name,f(b.value)+unit,b.color]])}"/>`;x+=slot});
    labels+=`<text x="${(gx0+x)/2}" y="${H-B+18}" text-anchor="middle" style="font-weight:600;fill:var(--text);font-size:11px">${g.label}</text>`;x+=gap});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axisY(L,W-R,y,ticks,tf)}<line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${out}${labels}</svg>`}

/* ---------- behaviour model + grid engine (reproduces the study workbook) ---------- */
const NIGHT=i=>i>=18||i<8, DAY=i=>i>=10&&i<16;
function probs(tariff,dist,wait){const c=DATA.coef,d=DATA.dummies;const u=tariff.map((p,i)=>c.fee*p/100+c.t1*d.t1[i]+c.t2*d.t2[i]+c.t3*d.t3[i]+c.dist*dist[i]+c.wait*wait[i]);const e=u.map(Math.exp),s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)}
function liArrays(li){return {dist:Array.from({length:24},(_,i)=>li&&NIGHT(i)?0.5:0),wait:Array.from({length:24},(_,i)=>li&&NIGHT(i)?10:0)}}
function seasonRun(season,tariff,li=false){const Sd=DATA.seasons[season],{dist,wait}=liArrays(li),p=probs(tariff,dist,wait),ev=p.map(v=>v*DATA.daily_ev);let curt=0,lng=0;const avg=new Array(24).fill(0),avg0=new Array(24).fill(0);
  for(const day of Sd.nl0)for(let h=0;h<24;h++){const nl=day[h]+ev[h];avg[h]+=nl;avg0[h]+=day[h];if(nl<0)curt-=nl;else lng+=nl}
  const n=Sd.ndays,cost=tariff.reduce((s,t,h)=>s+t*1000*ev[h],0)*n,dayShare=100*ev.reduce((s,v,h)=>s+(DAY(h)?v:0),0)/DATA.daily_ev,paid=tariff.reduce((s,t,h)=>s+t*ev[h],0)/DATA.daily_ev;
  return {p,ev,curt,lng,cost,ndays:n,nl:avg.map(v=>v/n),nl0:avg0.map(v=>v/n),dayShare,paid,avgTariff:tariff.reduce((a,b)=>a+b,0)/24,co2:lng*DATA.const.co2,lngCost:lng*DATA.const.lng_cost}}
function annualRun(tariffBySeason,li=false){const T={curt:0,lng:0,cost:0,co2:0,lngCost:0,days:0,ev:0};const per={};for(const s of SEASONS){const r=seasonRun(s,tariffBySeason[s],li);per[s]=r;T.curt+=r.curt;T.lng+=r.lng;T.cost+=r.cost;T.co2+=r.co2;T.lngCost+=r.lngCost;T.days+=r.ndays;T.ev+=DATA.daily_ev*r.ndays}return {...T,per}}
const memo={};function annualScen(k,li=false){const key=k+(li?'L':'');return memo[key]||(memo[key]=annualRun(DATA.tariff[k],li))}
function customTariff(x){return Array.from({length:24},(_,i)=>DAY(i)?x.day:NIGHT(i)?x.night:x.shoulder)}
function exploreTariffs(){if(S.x.mode==='custom'){const t=customTariff(S.x);return {Spring:t,Summer:t,Fall:t,Winter:t}}return DATA.tariff[S.x.mode]}
function blockAvg(t,fn){const v=t.filter((_,i)=>fn(i));return v.reduce((a,b)=>a+b,0)/v.length}

  ${callout(k==='bau'?tr('<b>현행 요금은 거의 평평합니다.</b> 시간대별 차이가 계절에 따라 15–43원에 그쳐 충전을 옮길 유인이 없고, 충전은 밤(22–08시)에 몰립니다. 낮에는 재생에너지가 남아 버려지고 밤에는 LNG를 돌려야 하므로, 2030년에는 EV가 늘수록 이 불일치가 커집니다.','<b>Today’s tariff is nearly flat.</b> With hourly differences of only 15–43 KRW depending on season there is no incentive to shift, and charging piles up at night (22–08). Renewables are wasted by day and LNG runs at night, so as EVs grow toward 2030 the mismatch grows with them.'):k==='sce1'?tr('<b>현행 범위(200–400원) 안에서는 두 단계 요금이 됩니다.</b> 낮 200원·밤 400원의 전형적인 TOU가 나오지만 200원 격차로는 밤 선호(365원)를 넘기 어려워, 오후 충전이 조금 늘어날 뿐 순부하는 여전히 깊은 U자입니다.','<b>Within today’s range (200–400 KRW) the result is a two-tier tariff.</b> A typical TOU of 200 by day and 400 by night emerges, but a 200 KRW gap cannot overcome the 365 KRW night preference; afternoon charging rises a little and net load stays a deep U.'):k==='sce2'?tr('<b>0–1,000원까지 허용하면 충전이 낮의 종 모양으로 바뀝니다.</b> 밤 1,000원·낮 0–200원의 큰 격차가 충전 대부분을 낮으로 옮겨 순부하가 눈에 띄게 평평해집니다. 다만 밤 1,000원은 현실적으로 도입하기 어렵습니다.','<b>Allowing 0–1,000 KRW turns charging into a daytime bell curve.</b> A gap of 1,000 KRW at night versus 0–200 by day moves most charging into the day and visibly flattens net load — but a 1,000 KRW night price is hard to implement.'):tr('<b>평균 요금을 유지해도 큰 격차는 효과가 있습니다.</b> 오전 8–9시부터 오후 2–3시까지(계절별 08–15시)를 0원으로 두고 밤을 500원 안팎으로 올리면 낮 충전이 크게 늘어납니다. 다만 13–17시에 충전이 몰려 새 피크가 생기는 눈사태 효과가 나타납니다.','<b>Even with the average price kept, a wide gap works.</b> Setting roughly 08–15 h (varies by season) to zero and night to around 500 KRW moves much charging into the day — but charging bunches at 13–17 h, producing a new peak: the avalanche effect.'))}

t,bau.curt),2)}%, LNG and carbon ${signed(-red(cur.lng,bau.lng),2)}%, bills ${signed(100*(cur.cost/bau.cost-1),2)}%${x.li?'':' — matching Table 6 of the paper'}. Move a slider to change this tariff.`))}

    <li><b>${tr('연간 전력망 효과','Annual grid effects')}</b> — ${tr('7개 시나리오의 출력제한·LNG·탄소·충전요금 발표값을 비교합니다.','Compare published curtailment, LNG, carbon and bills across seven scenarios.')}</li>
    <li><b>${tr('요금제 직접 설계','Design your own tariff')}</b> — ${tr('낮·밤 요금과 인프라 조건을 바꿔 결과를 직접 계산해 봅니다.','Set day and night prices and the infrastructure condition and see the results recalculated.')}</li></ol>
    <h3 style="margin-top:16px">${tr('용어','Glossary')}</h3><ol style="list-style:none;padding:0">${[[tr('TOU 요금','TOU tariff'),tr('시간대에 따라 다른 전기요금(Time-of-Use)','Electricity prices that vary by time of day (time-of-use)')],[tr('선택 실험 · 지불의사','Choice experiment · willingness to pay'),tr('가상의 충전 조건 중 하나를 고르게 해 선호를 재는 설문 · 어떤 조건을 얻기 위해 kWh당 더 낼 의사가 있는 금액','A survey that measures preferences by having people pick among hypothetical charging options · how much more per kWh people would pay for a condition')],[tr('순부하','Net load'),tr('전력수요(EV 충전 포함)에서 재생에너지 발전을 뺀 값. 음수면 재생에너지가 남고, 양수면 LNG가 채워야 함','Demand (including EV charging) minus renewable generation. Negative = renewable surplus; positive = LNG must fill the gap')],[tr('출력제한','Curtailment'),tr('수요보다 재생에너지가 많아 발전을 줄여 버리는 양','Renewable output switched off because it exceeds demand')],[tr('BaU','BaU'),tr('현행 요금을 그대로 두는 기준 시나리오(Business-as-Usual)','The baseline with today’s tariff kept (business-as-usual)')],[tr('LI (인프라 제한)','LI (limited infrastructure)'),tr('밤 18–08시에는 충전소가 500 m 떨어져 있고 10분 기다려야 한다는 조건','A condition in which night-time (18–08) chargers are 500 m away with a 10-minute wait')],[tr('눈사태 효과','Avalanche effect'),tr('요금이 싼 시간에 수요가 한꺼번에 몰려 새 피크가 생기는 부작용','A side effect in which demand piles into the cheapest hours and creates a new peak')],[tr('혼합로짓 모형','Mixed logit model'),tr('선택 자료에서 각 조건의 선호를 추정하는 통계 모형. 사람마다 선호가 다를 수 있음을 반영','A statistical model that estimates preferences from choice data, allowing them to differ across people')],[tr('SCE 1·2·3','SCE 1·2·3'),tr('논문의 요금 최적화 시나리오 1·2·3(요금 범위 200–400원 · 0–1,000원 · 0–1,000원이되 평균 유지)','The paper’s tariff-optimization scenarios 1–3 (price range 200–400 · 0–1,000 · 0–1,000 with the average kept)')],[tr('전력망(계통)','Grid'),tr('발전소에서 소비자까지 전기를 보내는 전체 체계. 여기서는 제주도의 전력 수급 전체를 뜻함','The whole system that delivers electricity from plants to users; here, Jeju’s entire supply–demand balance')],[tr('LNG 발전','LNG generation'),tr('재생에너지가 모자랄 때 돌리는 가스 발전. 연료비와 탄소배출이 여기서 나옴','Gas-fired generation that runs when renewables fall short; the source of fuel cost and carbon emissions here')],[tr('GWh · MWh · %p','GWh · MWh · pp'),tr('1 GWh = 1,000 MWh = 100만 kWh(제주 하루 EV 충전량 ≈ 3.9 GWh) · %p는 비율 사이의 차이(퍼센트포인트)','1 GWh = 1,000 MWh = one million kWh (Jeju’s daily EV charging ≈ 3.9 GWh) · pp = percentage points, the difference between two percentages')]].map(([t,d])=>`<li style="margin-bottom:4px"><b>${t}</b> — ${d}</li>`).join('')}</ol>
    <p class="foot">${tr('청록색 칩은 논문 발표값, 회색 칩은 연구 자료(시뮬레이션 워크북)의 값이거나 그 자료로 재현한 값, 주황색 칩은 대시보드에서 계산한 값입니다. 그래프 위에 마우스를 올리면 값을 볼 수 있습니다.','Teal chips mark published values, grey chips values from the study workbook or reproduced from it, and orange chips values calculated in this dashboard. Hover over charts for values.')}</p>
    <div class="close"><button class="btn" id="closeHowto">${tr('닫기','Close')}</button></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button,tr.clickable');if(!b)return;const d=b.dataset;
  if(d.lang){S.lang=d.lang;render();return}
  if(d.tab){S.tab=d.tab;render();window.scrollTo({top:0});return}
  if(d.season){S.season=d.season;render();return}
  if(d.gseason){S.gseason=d.gseason;render();return}
  if(d.scen){S.scen=d.scen;render();return}
  if(d.gscen){S.gscen=d.gscen;render();return}
  if(d.cmp){S.cmp=d.cmp;render();return}
  if(d.xmode){if(d.xmode==='custom'){const t=exploreTariffs()[S.x.season];S.x.day=Math.round(blockAvg(t,DAY)/50)*50;S.x.night=Math.round(blockAvg(t,NIGHT)/50)*50;S.x.shoulder=Math.round(blockAvg(t,i=>!DAY(i)&&!NIGHT(i))/50)*50}S.x.mode=d.xmode;render();return}
  if(d.xli){S.x.li=d.xli==='1';render();return}
  if(d.xseason){S.x.season=d.xseason;render();return}
  if(b.id==='howto'){$('howtoDialog').showModal();return}
  if(b.id==='closeHowto'){$('howtoDialog').close();return}
});
document.addEventListener('keydown',e=>{const t=e.target;if(t.matches&&t.matches('tr.clickable')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(t.dataset.scen)S.scen=t.dataset.scen;if(t.dataset.gscen)S.gscen=t.dataset.gscen;render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.type!=='range'||!el.dataset.param)return;const k=el.dataset.param,v=+el.value;
  if(S.x.mode!=='custom'){const t=exploreTariffs()[S.x.season];S.x.day=Math.round(blockAvg(t,DAY)/50)*50;S.x.night=Math.round(blockAvg(t,NIGHT)/50)*50;S.x.shoulder=Math.round(blockAvg(t,i=>!DAY(i)&&!NIGHT(i))/50)*50;S.x.mode='custom'}
  S.x[k]=v;const o=$('out-'+k);if(o)o.textContent=krw(v)+'/kWh';
  clearTimeout(render._t);render._t=setTimeout(()=>{const f=document.activeElement&&document.activeElement.id;render();if(f)$(f)?.focus({preventScroll:true})},60)});
$('howtoDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=tabDefs.findIndex(t=>t[0]===S.tab);i=e.key==='Home'?0:e.key==='End'?tabDefs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabDefs.length)%tabDefs.length;S.tab=tabDefs[i][0];render();$('tab-'+S.tab)?.focus()});
let lastNarrow=narrow(),rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(narrow()!==lastNarrow){lastNarrow=narrow();render()}},150)});
/* tooltip */
const tip=$('tip');
function showTip(el,x,y){let d;try{d=JSON.parse(el.dataset.tip)}catch{return}
  tip.replaceChildren();const t=document.createElement('div');t.className='t';t.textContent=d.t;tip.append(t);
  d.rows.forEach(([name,val,color])=>{const r=document.createElement('div');r.className='row';const l=document.createElement('span');const i=document.createElement('i');i.style.background=color;l.append(i,document.createTextNode(name));const b=document.createElement('b');b.textContent=val;r.append(l,b);tip.append(r)});
  tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(x+14,window.innerWidth-w-8)+'px';tip.style.top=(y+18+h>window.innerHeight?y-h-10:y+18)+'px'}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.style.display='none'});
document.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')tip.style.display='none'});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.style.display='none'});
/* restore state */
(function(){try{const q=new URLSearchParams(location.hash.slice(1));const saved=(()=>{try{return localStorage.getItem('evtou-lang')}catch{return null}})();
  if(['ko','en'].includes(q.get('lang')))S.lang=q.get('lang');else if(['ko','en'].includes(saved))S.lang=saved;
  if(tabDefs.some(t=>t[0]===q.get('tab')))S.tab=q.get('tab');
  if(SEASONS.includes(q.get('season')))S.season=q.get('season');if(['bau','sce1','sce2','sce3'].includes(q.get('scen')))S.scen=q.get('scen');
  if(DATA.pub[q.get('g')])S.gscen=q.get('g');if(SEASONS.includes(q.get('gs')))S.gseason=q.get('gs');if(['1','2','3'].includes(q.get('cmp')))S.cmp=q.get('cmp');
  if(['bau','sce1','sce2','sce3','custom'].includes(q.get('m')))S.x.mode=q.get('m');const okP=v=>v!==null&&Number.isInteger(+v)&&+v>=0&&+v<=1000&&+v%50===0;if(okP(q.get('d')))S.x.day=+q.get('d');if(okP(q.get('n')))S.x.night=+q.get('n');if(okP(q.get('sh')))S.x.shoulder=+q.get('sh');if(q.get('li')==='1')S.x.li=true;if(SEASONS.includes(q.get('xs')))S.x.season=q.get('xs');
  if(q.get('theme')==='light'||(window.self!==window.top&&q.get('theme')!=='dark'))document.documentElement.dataset.theme='light';}catch{}})();
render();

</script>
